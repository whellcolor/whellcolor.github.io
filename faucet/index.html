<body class="p-6">

    <div class="max-w-4xl mx-auto space-y-6">

        <h1 class="text-3xl font-bold mb-2">🚀 WCC Multi Faucet Chain</h1>

        <div class="glass">
            <div class="flex gap-3 flex-wrap items-center">
                <appkit-button></appkit-button>

                <button onclick="connectEVM()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    MetaMask

                <button onclick="connectTrustWallet()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                    Trust Wallet
                </button>

                <button onclick="connectSolana()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    Phantom
                </button>
            </div>

            <input id="wallet"
                class="w-full mt-4 p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500"
                placeholder="Wallet address"
            />
        </div>

        <div class="glass">
            <select id="network" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 mb-4"></select>

            <button onclick="claimFaucet()" class="bg-green-600 hover:bg-green-500 w-full p-3 rounded-xl font-semibold transition">
                Claim Faucet
            </button>

            <div id="cooldown" class="mt-3 text-yellow-300 text-sm font-medium">
                Ready
            </div>
        </div>

        <div id="status" class="glass text-sm text-slate-300">
            Ready...
        </div>

        <div class="glass">
            <h2 class="text-xl font-bold mb-3">History</h2>
            <div id="history" class="space-y-2"></div>
        </div>

        <div class="glass">
            <div id="bridge-widget-container"></div>
        </div>

        <div class="glass flex justify-center">
            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_top">
                <input type="hidden" name="cmd" value="_s-xclick" />
                <input type="hidden" name="hosted_button_id" value="JZ8YZT9LM257A" />
                <table class="text-center space-y-2">
                    <tr>
                        <td class="font-semibold text-sm">LAYANAN PELANGGAN</td>
                    </tr>
                    <tr>
                        <td class="py-2">
                            <select name="os0" class="bg-slate-900 border border-slate-700 p-2 rounded-xl text-sm">
                                <option value="Subcribe">Subcribe $5,00 USD - minggu</option>
                                <option value="Premium">Premium $25,00 USD - bulan</option>
                                <option value="Golden">Golden $100,00 USD - tahun</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="text-xs text-slate-400">Terima Kasih .</td>
                    </tr>
                    <tr>
                        <td class="py-2">
                            <input type="text" name="os1" maxLength="200" placeholder="Catatan / Pesan" class="bg-slate-900 border border-slate-700 p-2 rounded-xl text-sm w-full" />
                        </td>
                    </tr>
                </table>
                <input type="hidden" name="currency_code" value="USD" />
                <div class="mt-3 flex justify-center">
                    <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_subscribe_LG.gif" border="0" name="submit" title="PayPal - Cara yang lebih aman dan mudah untuk membayar secara daring!" alt="Berlangganan" />
                </div>
            </form>
        </div>

        <div class="glass">
            <thirdweb-bridge-widget></thirdweb-bridge-widget>
        </div>

    </div>

    <script>
        // Initialize Thirdweb Bridge Widget
        const container = document.querySelector('#bridge-widget-container');
        if (container && window.BridgeWidget) {
            BridgeWidget.render(container, {
                clientId: "2409d98fbe42fa94fb7ba259d6cf58c9",
                theme: "dark",
            });
        }

        // =========================
        // NETWORKS CONFIG (Optimized Public RPC)
        // =========================
        const NETWORKS = [
            { name: "Ethereum Sepolia", chain: "evm", rpc: "https://rpc.ankr.com/eth_sepolia" },
            { name: "Base Sepolia", chain: "evm", rpc: "https://sepolia.base.org" },
            { name: "Arbitrum Sepolia", chain: "evm", rpc: "https://sepolia-rollup.arbitrum.io/rpc" },
            { name: "Polygon Amoy", chain: "evm", rpc: "https://rpc-amoy.polygon.technology" },
            { name: "Avalanche Fuji", chain: "evm", rpc: "https://api.avax-test.network/ext/bc/C/rpc" },
            { name: "Solana Devnet", chain: "solana", rpc: "https://api.devnet.solana.com" }
        ];

        let cooldownTime = 60;

        // Load Networks into Dropdown
        function loadNetworks() {
            const el = document.getElementById("network");
            NETWORKS.forEach((n, i) => {
                const opt = document.createElement("option");
                opt.value = i;
                opt.innerText = n.name;
                el.appendChild(opt);
            });
        }
        loadNetworks();

        // Connect EVM (MetaMask)
        async function connectEVM() {
            if (!window.ethereum) return alert("Install MetaMask first!");
            try {
                const acc = await window.ethereum.request({ method: "eth_requestAccounts" });
                document.getElementById("wallet").value = acc[0];
                document.getElementById("status").innerText = "MetaMask Connected Successfully!";
            } catch (err) {
                console.error(err);
            }
        }

        // Connect Trust Wallet
        async function connectTrustWallet() {
            const provider = window.trustwallet || window.ethereum;
            if (!provider) {
                return alert("Trust Wallet extension not detected! Please open in Trust Wallet browser or install the extension.");
            }
            try {
                const accounts = await provider.request({ method: "eth_requestAccounts" });
                if (accounts && accounts.length > 0) {
                    document.getElementById("wallet").value = accounts[0];
                    document.getElementById("status").innerText = "Trust Wallet Connected Successfully!";
                }
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "Connection failed: " + err.message;
            }
        }

        // Connect Solana (Phantom)
        async function connectSolana() {
            if (!window.solana) return alert("Install Phantom first!");
            try {
                const res = await window.solana.connect();
                document.getElementById("wallet").value = res.publicKey.toString();
                document.getElementById("status").innerText = "Phantom Connected Successfully!";
            } catch (err) {
                console.error(err);
            }
        }

        // Anti Spam / Cooldown Checker
        function canClaim(wallet) {
            const key = "claim_" + wallet;
            const last = localStorage.getItem(key);
            if (!last) return true;
            return Date.now() - last > cooldownTime * 1000;
        }

        function saveClaim(wallet) {
            localStorage.setItem("claim_" + wallet, Date.now());
        }

        // History Management
        function saveHistory(data) {
            let h = JSON.parse(localStorage.getItem("tx")) || [];
            h.unshift(data);
            localStorage.setItem("tx", JSON.stringify(h));
            renderHistory();
        }

        function renderHistory() {
            let h = JSON.parse(localStorage.getItem("tx")) || [];
            document.getElementById("history").innerHTML = h.map(x => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                    <div class="font-bold text-emerald-400">${x.network}</div>
                    <div class="text-gray-400 truncate mt-1">${x.hash}</div>
                </div>
            `).join("");
        }
        renderHistory();

        // Cooldown Timer UI
        function startCooldown() {
            let t = cooldownTime;
            const i = setInterval(() => {
                document.getElementById("cooldown").innerText = "Cooldown: " + t + "s";
                t--;
                if (t < 0) {
                    clearInterval(i);
                    document.getElementById("cooldown").innerText = "Ready";
                }
            }, 1000);
        }

        // Contoh ABI standar untuk fungsi klaim faucet (sesuaikan dengan kontrak asli Anda)
        const faucetABI = [
            "function claim() external",
            "function drip() external"
        ];

        // Unified Claim Faucet Logic
        async function claimFaucet() {
            const walletAddress = document.getElementById("wallet").value.trim();
            if (!walletAddress) return alert("Masukkan alamat dompet terlebih dahulu!");
            if (!canClaim(walletAddress)) return alert("Cooldown active! Please wait.");

            const net = NETWORKS[document.getElementById("network").value];
            document.getElementById("status").innerText = "Menghubungkan ke dompet & blockchain...";

            try {
                if (net.chain === "solana") {
                    // Logika Solana (Airdrop)
                    const c = new solanaWeb3.Connection(net.rpc, "confirmed");
                    const sig = await c.requestAirdrop(
                        new solanaWeb3.PublicKey(walletAddress),
                        solanaWeb3.LAMPORTS_PER_SOL
                    );
                    saveHistory({ network: net.name, hash: sig });
                    document.getElementById("status").innerText = "SOL Airdrop Berhasil!";
                } else {
                    // Logika EVM (Memanggil Smart Contract Faucet)
                    if (!window.ethereum) return alert("Silakan instal MetaMask atau Trust Wallet!");

                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const signer = await provider.getSigner();

                    // Ganti dengan Alamat Kontrak Faucet Anda yang valid
                    const contractAddress = "0x5e8bade6e0bce65807db6327cb1d9eeb7c6a6a5b";
                    
                    const faucetContract = new ethers.Contract(contractAddress, faucetABI, signer);

                    document.getElementById("status").innerText = "Konfirmasi transaksi di dompet Anda...";

                    const tx = await faucetContract.claim();
                    
                    document.getElementById("status").innerText = "Transaksi dikirim, menunggu konfirmasi...";
                    
                    const receipt = await tx.wait();

                    saveHistory({
                        network: net.name,
                        hash: receipt.hash
                    });

                    document.getElementById("status").innerText = "Klaim Faucet EVM Berhasil!";
                }

                saveClaim(walletAddress);
                startCooldown();

            } catch (e) {
                console.error(e);
                document.getElementById("status").innerText = "Gagal: " + (e.reason || e.message);
            }
        }
    </script>
