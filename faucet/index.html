    <script>
        // Initialize Thirdweb Bridge Widget
        const container = document.querySelector('#bridge-widget-container');
        if (container && window.BridgeWidget) {
            BridgeWidget.render(container, {
                clientId: "2409d98fbe42fa94fb7ba259d6cf58c9",
                theme: "dark",
            });
        }

        // =========================
        // NETWORKS CONFIG
        // =========================
        const NETWORKS = [
            { name: "Ethereum Sepolia", chain: "evm", rpc: "https://sepolia.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" },
            { name: "Base Sepolia", chain: "evm", rpc: "https://base-sepolia.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" },
            { name: "Arbitrum Sepolia", chain: "evm", rpc: "https://arbitrum-sepolia.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" },
            { name: "Polygon Amoy", chain: "evm", rpc: "https://polygon-amoy.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" },
            { name: "Avalanche Fuji", chain: "evm", rpc: "https://avalanche-fuji.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" },
            { name: "Solana Devnet", chain: "solana", rpc: "https://solana-devnet.infura.io/v3/418d1e12e6e4490fa5ed80a4b3b8ae8a" }
        ];

        let cooldownTime = 60;

        // Load Networks into Dropdown
        function loadNetworks() {
            const el = document.getElementById("network");
            NETWORKS.forEach((n, i) => {
                const opt = document.createElement("option");
                opt.value = i;
                opt.innerText = n.name;
                el.appendChild(opt);
            });
        }
        loadNetworks();

        // Connect EVM (MetaMask)
        async function connectEVM() {
            if (!window.ethereum) return alert("Install MetaMask first!");
            try {
                const acc = await window.ethereum.request({ method: "eth_requestAccounts" });
                document.getElementById("wallet").value = acc[0];
            } catch (err) {
                console.error(err);
            }
        }

        // Connect Solana (Phantom)
        async function connectSolana() {
            if (!window.solana) return alert("Install Phantom first!");
            try {
                const res = await window.solana.connect();
                document.getElementById("wallet").value = res.publicKey.toString();
            } catch (err) {
                console.error(err);
            }
        }
// =========================
// CONNECT TRUST WALLET
// =========================
async function connectTrustWallet() {
    // Trust Wallet injects its provider, or can be accessed via window.ethereum if Trust is primary
    const provider = window.trustwallet || window.ethereum;

    if (!provider) {
        return alert("Trust Wallet extension not detected! Please open in Trust Wallet browser or install the extension.");
    }

    try {
        const accounts = await provider.request({
            method: "eth_requestAccounts"
        });
        
        if (accounts && accounts.length > 0) {
            document.getElementById("wallet").value = accounts[0];
            document.getElementById("status").innerText = "Trust Wallet Connected Successfully!";
        }
    } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Connection failed: " + err.message;
    }
}
        // Fast RPC Checker
        async function getFastestRPC(chain) {
            const list = NETWORKS.filter(x => x.chain === chain);
            let best = list[0];
            let bestTime = 999999;

            for (const r of list) {
                const start = Date.now();
                try {
                    if (chain === "evm") {
                        const p = new ethers.JsonRpcProvider(r.rpc);
                        await p.getBlockNumber();
                    } else {
                        const c = new solanaWeb3.Connection(r.rpc);
                        await c.getBlockHeight();
                    }
                    const t = Date.now() - start;
                    if (t < bestTime) {
                        best = r;
                        bestTime = t;
                    }
                } catch (e) {}
            }
            return best;
        }

        // Anti Spam / Cooldown Checker
        function canClaim(wallet) {
            const key = "claim_" + wallet;
            const last = localStorage.getItem(key);
            if (!last) return true;
            return Date.now() - last > cooldownTime * 1000;
        }

        function saveClaim(wallet) {
            localStorage.setItem("claim_" + wallet, Date.now());
        }

        // History Management
        function saveHistory(data) {
            let h = JSON.parse(localStorage.getItem("tx")) || [];
            h.unshift(data);
            localStorage.setItem("tx", JSON.stringify(h));
            renderHistory();
        }

        function renderHistory() {
            let h = JSON.parse(localStorage.getItem("tx")) || [];
            document.getElementById("history").innerHTML = h.map(x => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                    <div class="font-bold text-emerald-400">${x.network}</div>
                    <div class="text-gray-400 truncate mt-1">${x.hash}</div>
                </div>
            `).join("");
        }
        renderHistory();

        // Cooldown Timer UI
        function startCooldown() {
            let t = cooldownTime;
            const i = setInterval(() => {
                document.getElementById("cooldown").innerText = "Cooldown: " + t + "s";
                t--;
                if (t < 0) {
                    clearInterval(i);
                    document.getElementById("cooldown").innerText = "Ready";
                }
            }, 1000);
        }

        // Claim Faucet Logic
        async function claimFaucet() {
            const wallet = document.getElementById("wallet").value.trim();
            if (!wallet) return alert("Input wallet address first!");
            if (!canClaim(wallet)) return alert("Cooldown active! Please wait.");

            const net = NETWORKS[document.getElementById("network").value];
            document.getElementById("status").innerText = "Processing transaction...";

            try {
                if (net.chain === "solana") {
                    const c = new solanaWeb3.Connection(net.rpc, "confirmed");
                    const sig = await c.requestAirdrop(
                        new solanaWeb3.PublicKey(wallet),
                        solanaWeb3.LAMPORTS_PER_SOL
                    );
                    saveHistory({ network: net.name, hash: sig });
                    document.getElementById("status").innerText = "SOL Airdrop Success!";
                } else {
                    const rpc = await getFastestRPC("evm");
                    const p = new ethers.JsonRpcProvider(rpc.rpc);
                    const b = await p.getBlockNumber();
                    saveHistory({ network: net.name, hash: "RPC Block: " + b });
                    document.getElementById("status").innerText = "EVM RPC Verified Successfully!";
                }

                saveClaim(wallet);
                startCooldown();
            } catch (e) {
                document.getElementById("status").innerText = "Error: " + e.message;
            }
        }
        const NETWORKS = [
    {
        name: "Ethereum Sepolia",
        chain: "evm",
        rpc: "https://rpc.ankr.com/eth_sepolia"
    },
    {
        name: "Base Sepolia",
        chain: "evm",
        rpc: "https://sepolia.base.org"
    },
    {
        name: "Arbitrum Sepolia",
        chain: "evm",
        rpc: "https://sepolia-rollup.arbitrum.io/rpc"
    },
    {
        name: "Polygon Amoy",
        chain: "evm",
        rpc: "https://rpc-amoy.polygon.technology"
    },
    {
        name: "Avalanche Fuji",
        chain: "evm",
        rpc: "https://api.avax-test.network/ext/bc/C/rpc"
    },
    {
        name: "Solana Devnet",
        chain: "solana",
        rpc: "https://api.devnet.solana.com"
    }
];

        // Contoh ABI standar untuk fungsi klaim faucet (sesuaikan dengan kontrak asli Anda)
const faucetABI = [
    "function claim() external",
    "function drip() external"
];

async function claimFaucet() {
    const walletAddress = document.getElementById("wallet").value.trim();
    if (!walletAddress) return alert("Masukkan alamat dompet terlebih dahulu!");

    const net = NETWORKS[document.getElementById("network").value];
    document.getElementById("status").innerText = "Menghubungkan ke dompet & blockchain...";

    try {
        if (net.chain === "solana") {
            // Logika Solana (Airdrop)
            const c = new solanaWeb3.Connection(net.rpc, "confirmed");
            const sig = await c.requestAirdrop(
                new solanaWeb3.PublicKey(walletAddress),
                solanaWeb3.LAMPORTS_PER_SOL
            );
            saveHistory({ network: net.name, hash: sig });
            document.getElementById("status").innerText = "SOL Airdrop Berhasil!";
        } else {
            // Logika EVM (Memanggil Smart Contract Faucet)
            if (!window.ethereum) return alert("Silakan instal MetaMask atau Trust Wallet!");

            // Meminta provider dari browser (MetaMask/Trust Wallet)
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // Alamat kontrak faucet Anda
            const contractAddress = "0x5e8bade6e0bce65807db6327cb1d9eeb7c6a6a5b";
            
            // Hubungkan ke kontrak pintar
            const faucetContract = new ethers.Contract(contractAddress, faucetABI, signer);

            document.getElementById("status").innerText = "Konfirmasi transaksi di dompet Anda...";

            // Panggil fungsi claim di smart contract (sesuaikan nama fungsi, misal: claim() atau drip())
            const tx = await faucetContract.claim();
            
            document.getElementById("status").innerText = "Transaksi dikirim, menunggu konfirmasi...";
            
            // Tunggu transaksi selesai
            const receipt = await tx.wait();

            saveHistory({
                network: net.name,
                hash: receipt.hash
            });

            document.getElementById("status").innerText = "Klaim Faucet EVM Berhasil!";
        }

        saveClaim(walletAddress);
        startCooldown();

    } catch (e) {
        console.error(e);
        document.getElementById("status").innerText = "Gagal: " + (e.reason || e.message);
    }
}
    </script>
